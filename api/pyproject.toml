[project]
name = "flock-api"
version = "0.1.0"
description = "Sighting writer (queue -> Postgres) and search API"
requires-python = ">=3.11"
dependencies = [
    "flock-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "redis>=5.0",          # client ใช้กับ Valkey ได้ (MIT)
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
flock-writer = "flock_api.writer:main"
flock-linker = "flock_api.linker:main"
flock-users = "flock_api.users:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flock_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
